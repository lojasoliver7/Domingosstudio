<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 84" width="280" height="84" fill="none">
  <!-- Brand Icon Box -->
  <g class="logo-box">
    <rect x="2" y="10" width="56" height="56" rx="8" fill="#000000" stroke="#0066FF" stroke-width="2"/>
    <!-- Subtle glow/accent line -->
    <rect x="2" y="10" width="56" height="56" rx="8" fill="url(#box-glow)" opacity="0.15"/>
    <text x="30" y="49" font-family="'Plus Jakarta Sans', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle">D</text>
  </g>

  <!-- Typography -->
  <g transform="translate(72, 0)">
    <!-- DOMINGOS // -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5" fill="#FFFFFF">DOMINGOS <tspan fill="#00D2FF" font-weight="700">//</tspan></text>
    
    <!-- STUDIO -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="1" fill="#FFFFFF">STUDIO</text>
    
    <!-- DIGITAL ARCHITECTURE -->
    <text x="0" y="73" font-family="'Plus Jakarta Sans', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2.8" fill="#94A3B8">DIGITAL ARCHITECTURE</text>
  </g>

  <defs>
    <linearGradient id="box-glow" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
  </defs>
</svg>
